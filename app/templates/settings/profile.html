{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}Profile Settings{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" name="display_name" class="form-control" value="{{ current_user.display_name }}">
            </div>
            <div class="form-group">
                <label>School Name</label>
                <input type="text" name="school_name" class="form-control" value="{{ current_user.school_name }}">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
            </div>
            <div class="btn-group" style="margin-top:16px;">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('settings.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

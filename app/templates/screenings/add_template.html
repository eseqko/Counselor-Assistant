{% extends "base.html" %}
{% block title %}New Screening Template{% endblock %}
{% block page_title %}New Custom Screening Template{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid-2">
                <div class="form-group">
                    <label>Template Name *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Short Name / Acronym</label>
                    <input type="text" name="short_name" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Instructions to student</label>
                <textarea name="instructions" class="form-control" rows="2"></textarea>
            </div>
            <h3>Questions</h3>
            <p style="font-size:0.84rem;color:var(--gray);">Each question uses 0-3 Likert scale (Not at all → Nearly every day).</p>
            <div id="questions"></div>
            <button type="button" onclick="addQ()" class="btn btn-sm btn-outline">+ Add Question</button>

            <div style="display:flex;gap:8px;margin-top:16px;">
                <button type="submit" class="btn btn-primary">Save Template</button>
                <a href="{{ url_for('screenings.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
function addQ() {
    var container = document.getElementById('questions');
    var idx = container.children.length + 1;
    var div = document.createElement('div');
    div.className = 'form-group';
    div.style.cssText = 'display:flex;gap:8px;align-items:center;';
    div.innerHTML = '<span style="min-width:24px;">'+idx+'.</span><input type="text" name="q_text" class="form-control" placeholder="Question text" style="flex:1;"><button type="button" onclick="this.parentElement.remove()" class="btn btn-sm btn-danger">x</button>';
    container.appendChild(div);
}
addQ();
</script>
{% endblock %}

<!-- Structured format -->
<div class="structured-fields" id="structuredArea">
    <div class="sf-section">
        <label>Discussion Points</label>
        <textarea id="sf-discussion" placeholder="What was discussed..."></textarea>
    </div>
    <div class="sf-section">
        <label>Decisions Made</label>
        <textarea id="sf-decisions" placeholder="Key decisions from this meeting..." style="min-height:60px;"></textarea>
    </div>
    <div class="sf-section">
        <label>Action Items</label>
        <textarea id="sf-actions" placeholder="Who needs to do what and by when..." style="min-height:60px;"></textarea>
    </div>
    <div class="sf-section">
        <label>Follow-ups</label>
        <textarea id="sf-followups" placeholder="Next steps, follow-up dates..." style="min-height:60px;"></textarea>
    </div>
</div>

<!-- Cornell format -->
<div class="cornell-layout" id="cornellArea">
    <div class="cornell-cue">
        <span class="cornell-cue-label">Cues / Questions</span>
        <textarea id="cornell-cue" placeholder="Key questions&#10;Main ideas&#10;Vocabulary..."></textarea>
    </div>
    <div class="cornell-notes">
        <span class="cornell-notes-label">Notes</span>
        <textarea id="cornell-notes" placeholder="Detailed notes from the meeting..."></textarea>
    </div>
    <div class="cornell-summary">
        <span class="cornell-summary-label">Summary</span>
        <textarea id="cornell-summary" placeholder="Brief summary of the meeting in your own words..."></textarea>
    </div>
</div>

<!-- Outline format -->
<div class="outline-area" id="outlineArea">
    <textarea id="outline-content" placeholder="I. Main Topic&#10;   A. Sub-point&#10;      1. Detail&#10;   B. Sub-point&#10;II. Next Topic&#10;   A. Sub-point"></textarea>
    <div class="outline-hint">Use Tab to indent, Shift+Tab to outdent. Roman numerals, letters, and numbers for hierarchy.</div>
</div>

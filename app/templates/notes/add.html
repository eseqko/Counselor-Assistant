{% extends "base.html" %}
{% block title %}New Note{% endblock %}
{% block page_title %}New Conference Note{% endblock %}
{% block content %}
<div class="card" style="max-width:860px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-row">
                <div class="form-group">
                    <label>Student *</label>
                    <select name="student_id" class="form-control" required>
                        <option value="">-- Select Student --</option>
                        {% for s in students %}
                        <option value="{{ s.id }}" {{ 'selected' if preselected_student == s.id|string }}>{{ s.full_name }} ({{ s.student_id_number }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select name="note_type" class="form-control" required>
                        <option value="">-- Select --</option>
                        {% for val, label in note_types %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="session_date" class="form-control" value="{{ today if today else '' }}">
                </div>
                <div class="form-group">
                    <label>Duration (min)</label>
                    <input type="number" name="duration_minutes" class="form-control" min="1">
                </div>
                <div class="form-group">
                    <label>Referred By</label>
                    <input type="text" name="referred_by" class="form-control" placeholder="e.g., Teacher, Self, Parent">
                </div>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" class="form-control" placeholder="Brief description...">
            </div>

            <div class="form-group">
                <label>Comment *</label>
                <textarea name="content" class="form-control" rows="5" required placeholder="Session details..."></textarea>
            </div>

            <div class="form-group">
                <label>Private Comment</label>
                <textarea name="private_comment" class="form-control" rows="2" placeholder="Confidential notes (not shared)..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ASCA Domain</label>
                    <select name="asca_domain" class="form-control">
                        <option value="">--</option>
                        {% for val, label in asca_domains %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Delivery Method</label>
                    <select name="delivery_method" class="form-control">
                        <option value="">--</option>
                        {% for val, label in delivery_methods %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Setting</label>
                    <input type="text" name="setting" class="form-control" placeholder="e.g., Office, Classroom">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" name="topic_category" class="form-control">
                </div>
                <div class="form-group">
                    <label>Outcome</label>
                    <input type="text" name="outcome" class="form-control" placeholder="Result or next steps...">
                </div>
            </div>

            <h3 style="margin:20px 0 12px;font-size:0.95rem;">Follow-Up & Referral</h3>
            <div style="display:flex;gap:24px;margin-bottom:8px;">
                <div class="form-check">
                    <input type="checkbox" name="follow_up_needed" id="follow_up_needed">
                    <label for="follow_up_needed">Follow-up needed</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="referral_made" id="referral_made">
                    <label for="referral_made">Referral made</label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Follow-Up Date</label>
                    <input type="date" name="follow_up_date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Follow-Up Notes</label>
                    <input type="text" name="follow_up_notes" class="form-control">
                </div>
                <div class="form-group">
                    <label>Referral To</label>
                    <input type="text" name="referral_to" class="form-control" placeholder="e.g., Outside counselor, CPS">
                </div>
            </div>

            <div class="form-check">
                <input type="checkbox" name="is_confidential" id="is_confidential" checked>
                <label for="is_confidential">Mark as Confidential</label>
            </div>

            <div class="btn-group" style="margin-top:16px;">
                <button type="submit" class="btn btn-primary">Save Note</button>
                <a href="{{ url_for('notes.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

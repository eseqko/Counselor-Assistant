<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Portal{% endblock %}</title>
    <style>
        :root {
            --primary: #4A90D9;
            --primary-light: #5B9FE8;
            --bg: #f5f7fa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .header .subtitle { font-size: 0.86rem; color: var(--text-muted); }
        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 14px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
        }
        .form-control:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
        textarea.form-control { resize: vertical; }
        .footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.76rem;
            color: var(--text-muted);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --surface: #1f2937;
                --text: #f9fafb;
                --text-muted: #9ca3af;
                --border: #374151;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#127891; Student Resource Portal</h1>
        <div class="subtitle">{{ counselor.school_name or counselor.display_name }}'s Counseling Office</div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        Powered by Counselor Assistant &middot; AI runs locally — your information stays private.
    </div>
</body>
</html>

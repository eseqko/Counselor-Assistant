{% extends "base.html" %}
{% block title %}Edit {{ student.display_name }}{% endblock %}
{% block page_title %}Edit Student{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-row">
                <div class="form-group">
                    <label>Student ID *</label>
                    <input type="text" name="student_id_number" class="form-control" value="{{ student.student_id_number }}" required>
                </div>
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" name="first_name" class="form-control" value="{{ student.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" name="last_name" class="form-control" value="{{ student.last_name }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Grade</label>
                    <select name="grade_level" class="form-control">
                        <option value="">--</option>
                        {% for g in range(6, 13) %}
                        <option value="{{ g }}" {{ 'selected' if student.grade_level == g }}>Grade {{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>DOB</label>
                    <input type="date" name="date_of_birth" class="form-control" value="{{ student.date_of_birth.strftime('%Y-%m-%d') if student.date_of_birth else '' }}">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" class="form-control">
                        <option value="">--</option>
                        {% for g in ['Male', 'Female', 'Non-Binary', 'Other', 'Prefer not to say'] %}
                        <option value="{{ g }}" {{ 'selected' if student.gender == g }}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Ethnicity</label>
                    <input type="text" name="ethnicity" class="form-control" value="{{ student.ethnicity }}">
                </div>
                <div class="form-group">
                    <label>Homeroom</label>
                    <input type="text" name="homeroom" class="form-control" value="{{ student.homeroom }}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" class="form-control">
                        {% for s in ['active', 'inactive', 'transferred', 'graduated'] %}
                        <option value="{{ s }}" {{ 'selected' if student.status == s }}>{{ s|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" value="{{ student.email }}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ student.phone }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Parent/Guardian</label>
                    <input type="text" name="parent_guardian_name" class="form-control" value="{{ student.parent_guardian_name }}">
                </div>
                <div class="form-group">
                    <label>Parent Phone</label>
                    <input type="text" name="parent_guardian_phone" class="form-control" value="{{ student.parent_guardian_phone }}">
                </div>
                <div class="form-group">
                    <label>Parent Email</label>
                    <input type="email" name="parent_guardian_email" class="form-control" value="{{ student.parent_guardian_email }}">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" class="form-control" rows="2">{{ student.address }}</textarea>
            </div>
            <div style="display:flex;gap:24px;margin:16px 0;">
                <div class="form-check">
                    <input type="checkbox" name="iep_status" id="iep_status" {{ 'checked' if student.iep_status }}>
                    <label for="iep_status">IEP</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="section_504" id="section_504" {{ 'checked' if student.section_504 }}>
                    <label for="section_504">504</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="ell_status" id="ell_status" {{ 'checked' if student.ell_status }}>
                    <label for="ell_status">ELL</label>
                </div>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('caseload.view_student', id=student.id) }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

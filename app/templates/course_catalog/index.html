{% extends "base.html" %}
{% block title %}Course Catalog{% endblock %}
{% block page_title %}Course Catalog Wiki{% endblock %}
{% block head %}
<style>
    .catalog-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        flex-wrap: wrap;
    }
    .catalog-toolbar .tab-btn {
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid var(--border-color, #dde1e7);
        background: #fff;
        color: #6b7280;
        transition: all 0.2s;
    }
    .catalog-toolbar .tab-btn:hover {
        border-color: var(--primary, #2C5F8A);
        color: var(--primary, #2C5F8A);
    }
    .catalog-toolbar .tab-btn.active {
        background: var(--primary, #2C5F8A);
        color: #fff;
        border-color: var(--primary, #2C5F8A);
    }
    .catalog-toolbar .tab-hint {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-left: auto;
    }
    .catalog-frame-wrap {
        border: 1px solid #dde1e7;
        border-radius: 8px;
        overflow: hidden;
        background: #f4f6f9;
    }
    .catalog-frame-wrap iframe {
        width: 100%;
        height: calc(100vh - 180px);
        min-height: 500px;
        border: none;
        display: block;
    }
    .btn-standalone {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid #7c3aed;
        background: #fff;
        color: #7c3aed;
        transition: all 0.2s;
        text-decoration: none;
    }
    .btn-standalone:hover {
        background: #7c3aed;
        color: #fff;
    }
    .btn-standalone .icon { font-size: 1rem; }
</style>
<meta name="csrf-token" content="{{ csrf_token() }}">
{% endblock %}
{% block content %}
<div class="catalog-toolbar">
    <button class="tab-btn active" id="tabCatalog" onclick="switchCatalogView('index.html', this)">Catalog</button>
    <button class="tab-btn" id="tabEditor" onclick="switchCatalogView('editor.html', this)">Editor</button>
    <button class="tab-btn" id="tabSetup" onclick="switchCatalogView('setup.html', this)">School Setup</button>
    <a class="btn-standalone" href="http://127.0.0.1:5001" target="_blank" title="Open Course Catalog Wiki as a standalone app (no login required)">
        <span class="icon">&#x1F517;</span> Standalone
    </a>
    <button class="tab-btn" id="btnSync" onclick="syncCoursesToDB()" style="margin-left:auto;background:#16a34a;color:#fff;border-color:#16a34a;">
        Sync to Database
    </button>
    <span class="tab-hint" id="syncHint">Sync your catalog to enable AI Course Recommendations</span>
</div>
<div class="catalog-frame-wrap">
    <iframe id="catalogFrame"
            src="{{ url_for('static', filename='course_catalog/index.html') }}"
            title="Virtual Course Catalog"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
            loading="lazy"></iframe>
</div>
{% endblock %}
{% block scripts %}
<script>
function switchCatalogView(page, btn) {
    var base = '{{ url_for("static", filename="course_catalog/") }}';
    document.getElementById('catalogFrame').src = base + page;
    var btns = document.querySelectorAll('.catalog-toolbar .tab-btn:not(#btnSync)');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');
}

function syncCoursesToDB() {
    var btn = document.getElementById('btnSync');
    var hint = document.getElementById('syncHint');
    var courses = [];
    var info = null;

    try {
        var raw = localStorage.getItem('jhs_catalog_courses');
        if (raw) courses = JSON.parse(raw);
        var rawInfo = localStorage.getItem('jhs_catalog_info');
        if (rawInfo) info = JSON.parse(rawInfo);
    } catch (e) {}

    if (!courses.length) {
        hint.textContent = 'No courses found in browser storage.';
        hint.style.color = '#dc2626';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Syncing...';
    hint.textContent = 'Sending ' + courses.length + ' courses to database...';
    hint.style.color = '#6b7280';

    fetch('/course-catalog/api/sync-courses', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token() }}'
        },
        body: JSON.stringify({ courses: courses, info: info })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        btn.disabled = false;
        btn.textContent = 'Sync to Database';
        if (data.ok) {
            hint.textContent = 'Synced ' + data.synced + ' courses to database! AI recommendations are now ready.';
            hint.style.color = '#16a34a';
        } else {
            hint.textContent = 'Sync failed: ' + (data.error || 'Unknown error');
            hint.style.color = '#dc2626';
        }
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'Sync to Database';
        hint.textContent = 'Sync failed: ' + err.message;
        hint.style.color = '#dc2626';
    });
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Edit Consent{% endblock %}
{% block page_title %}Edit Consent{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Type *</label>
                <select name="consent_type" class="form-control" required>
                    {% for v, l in consent_types %}<option value="{{ v }}" {{ 'selected' if v == consent.consent_type }}>{{ l }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="2">{{ consent.description or '' }}</textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" name="guardian_name" class="form-control" value="{{ consent.guardian_name or '' }}">
                </div>
                <div class="form-group">
                    <label>Relationship</label>
                    <select name="guardian_relationship" class="form-control">
                        <option value="">--</option>
                        {% for v, l in relationships %}<option value="{{ v }}" {{ 'selected' if v == consent.guardian_relationship }}>{{ l }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="guardian_phone" class="form-control" value="{{ consent.guardian_phone or '' }}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="guardian_email" class="form-control" value="{{ consent.guardian_email or '' }}">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Request Date</label>
                    <input type="date" name="request_date" class="form-control" value="{{ consent.request_date.strftime('%Y-%m-%d') if consent.request_date else '' }}">
                </div>
                <div class="form-group">
                    <label>Received Date</label>
                    <input type="date" name="received_date" class="form-control" value="{{ consent.received_date.strftime('%Y-%m-%d') if consent.received_date else '' }}">
                </div>
                <div class="form-group">
                    <label>Expires</label>
                    <input type="date" name="expiration_date" class="form-control" value="{{ consent.expiration_date.strftime('%Y-%m-%d') if consent.expiration_date else '' }}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" class="form-control">
                        {% for v, l in statuses %}<option value="{{ v }}" {{ 'selected' if v == consent.status }}>{{ l }}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Method</label>
                    <select name="method" class="form-control">
                        <option value="">--</option>
                        {% for v, l in methods %}<option value="{{ v }}" {{ 'selected' if v == consent.method }}>{{ l }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Replace Document</label>
                    <input type="file" name="document" class="form-control">
                    {% if consent.document_filename %}<div style="font-size:0.78rem;color:var(--gray);margin-top:4px;">Current: {{ consent.document_filename }}</div>{% endif %}
                </div>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ consent.notes or '' }}</textarea>
            </div>

            <div style="display:flex;gap:8px;">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('consents.view', id=consent.id) }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

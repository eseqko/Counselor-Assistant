{% extends "base.html" %}
{% block title %}Edit Event{% endblock %}
{% block page_title %}Edit Event{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start *</label>
                    <input type="datetime-local" name="start_datetime" class="form-control" value="{{ event.start_datetime.strftime('%Y-%m-%dT%H:%M') }}" required>
                </div>
                <div class="form-group">
                    <label>End</label>
                    <input type="datetime-local" name="end_datetime" class="form-control" value="{{ event.end_datetime.strftime('%Y-%m-%dT%H:%M') }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Event Type</label>
                    <select name="event_type" class="form-control">
                        {% for val, label in event_types %}
                        <option value="{{ val }}" {{ 'selected' if event.event_type == val }}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" class="form-control">
                        <option value="scheduled" {{ 'selected' if event.status == 'scheduled' }}>Scheduled</option>
                        <option value="completed" {{ 'selected' if event.status == 'completed' }}>Completed</option>
                        <option value="cancelled" {{ 'selected' if event.status == 'cancelled' }}>Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" class="form-control" value="{{ event.location }}">
            </div>
            <div class="form-group">
                <label>Related Student</label>
                <select name="student_id" class="form-control">
                    <option value="">-- None --</option>
                    {% for s in students %}
                    <option value="{{ s.id }}" {{ 'selected' if event.student_id == s.id }}>{{ s.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3">{{ event.description }}</textarea>
            </div>
            <div class="form-check">
                <input type="checkbox" name="all_day" id="all_day" {{ 'checked' if event.all_day }}>
                <label for="all_day">All Day Event</label>
            </div>
            <div class="btn-group" style="margin-top:16px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('calendar.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
        <form method="POST" action="{{ url_for('calendar.delete_event', id=event.id) }}" data-confirm="Delete this event?" style="margin-top:12px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-sm btn-danger">Delete Event</button>
        </form>
    </div>
</div>
{% endblock %}
